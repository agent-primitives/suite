name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  go:
    name: Go and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Module metadata
        run: go mod tidy -diff
      - name: Formatting
        run: |
          formatted=$(gofmt -l .)
          if [ -n "$formatted" ]; then
            printf '%s\n' "$formatted"
            exit 1
          fi
      - name: Tests and required conformance fixtures (no skips)
        env:
          TEST_RESULTS: ${{ runner.temp }}/suite-tests.jsonl
        run: |
          set -euo pipefail
          go test -count=1 -json ./... | tee "$TEST_RESULTS"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              "TestValidatePathAcceptsMinimalExtractedSuite",
              "TestCoordinatorWorkersFixtureIsConformant",
              "TestRemoteMCPFixtureIsConformantAndCatalogable",
              "TestToolProviderSchemaAcceptsMultiFileCLIBundles",
              "TestToolProviderCompositionSchemaDefinesStandaloneSandboxInput",
              "TestEmbeddedEvaluationsAcceptDirectoryAndOCI",
              "TestEvaluationReferenceSchemas",
              "TestRuntimeProfilesGraphAndReport",
              "TestRuntimeProfileSchemaDecoderParity",
              "TestRuntimeProfilesSameOCISeparateEvidence",
              "TestPolicyBindingFixtureConformance",
              "TestAgentPolicyReferenceSchema",
              "TestPolicyBindingDigestPropagationAndStaleAncestors",
              "TestSharedDecodeCases",
              "TestSharedJSONConformance",
              "TestSharedImageReferenceConformance",
              "TestSharedDirectoryRules",
              "TestSharedDirectoryAccess",
              "TestSharedArchiveCases",
              "TestPackageCorpusRejectsTrailingData",
              "TestRawVariantDigestsPreserveExplicitZeroValues",
              "TestLooseDirectorySharedCorpus",
              "TestValidatePathAcceptsOCILayout",
              "TestDiffPathsTreatsExtractedSuiteAndOCILayoutAsEquivalent",
              "TestLooseDirectoryIdentityGolden",
              "TestLooseDirectoryDeclaredModeIgnoresHostMode",
              "TestLooseDirectoryConflictingDeclarationsRefuse",
              "TestLooseDirectoryDeclaredDirectoryMetadata",
              "TestPublishedArtifactIdentityGolden",
              "TestPublishedArtifactInventoryModesRemainExact",
          }
          events = [json.loads(line) for line in Path(os.environ["TEST_RESULTS"]).read_text().splitlines()]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          skipped = [event.get("Test", event.get("Package")) for event in events if event.get("Action") == "skip"]
          missing = sorted(required - passed)
          if skipped or missing:
              raise SystemExit(f"Conformance gate failed: skipped={skipped}; missing passes={missing}")
          print(f"Conformance gate: {len(required)} required tests passed; no skips")
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Unsupported platforms fail closed
        run: |
          set -euo pipefail
          GOOS=js GOARCH=wasm go test -count=1 -json -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -run '^TestUnsupportedDirectorySecurity$' ./internal/artifact | tee "$RUNNER_TEMP/unsupported-security.jsonl"
          python3 - "$RUNNER_TEMP/unsupported-security.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path

          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          passed = any(event.get("Action") == "pass" and event.get("Test") == "TestUnsupportedDirectorySecurity" for event in events)
          skipped = any(event.get("Action") == "skip" for event in events)
          if not passed or skipped:
              raise SystemExit("Unsupported directory-security test must pass without skips")
          PY
          mkdir -p "$RUNNER_TEMP/plan9-tests" "$RUNNER_TEMP/wasip1-tests"
          GOOS=plan9 GOARCH=amd64 go test -c -o "$RUNNER_TEMP/plan9-tests/" . ./oci ./evidence ./experimental/flow ./internal/artifact
          GOOS=wasip1 GOARCH=wasm go test -c -o "$RUNNER_TEMP/wasip1-tests/" . ./oci ./evidence ./experimental/flow ./internal/artifact
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  go-umask:
    name: Go tests (umask 077)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Tests with private default permissions (no skips)
        env:
          TEST_RESULTS: ${{ runner.temp }}/suite-tests-umask-077.jsonl
        run: |
          set -euo pipefail
          umask 077
          go test -count=1 -json ./... | tee "$TEST_RESULTS"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          events = [json.loads(line) for line in Path(os.environ["TEST_RESULTS"]).read_text().splitlines()]
          skipped = [event.get("Test", event.get("Package")) for event in events if event.get("Action") == "skip"]
          if skipped:
              raise SystemExit(f"Tests skipped under umask 077: {skipped}")
          PY

  portable-identity:
    name: Portable identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build and vet
        run: go build ./... && go vet ./...
      - name: Golden identities and native access checks (no skips)
        env:
          TEST_RESULTS: ${{ runner.temp }}/portable-identity.jsonl
        run: |
          set -euo pipefail
          go test -count=1 -json -run '^(TestLooseDirectory|TestPublishedArtifact|TestWindowsDirectorySecurity|TestRawVariantDigests|TestRichEvaluationFixture|TestSharedDirectory|TestSharedArchive)' ./internal/artifact | tee "$TEST_RESULTS"
          python3 - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          required = {
              "TestLooseDirectorySharedCorpus",
              "TestRawVariantDigestsPreserveExplicitZeroValues",
              "TestSharedDirectoryRules",
              "TestSharedDirectoryAccess",
              "TestSharedArchiveCases",
              "TestRichEvaluationFixtureConformance",
              "TestRichEvaluationFixtureOrderedConstraints",
              "TestRichEvaluationFixtureRejectsStaleSources",
              "TestRichEvaluationFixtureOrderChangesIdentity",
              "TestLooseDirectoryIdentityGolden",
              "TestLooseDirectoryDeclaredModeIgnoresHostMode",
              "TestLooseDirectoryConflictingDeclarationsRefuse",
              "TestLooseDirectoryDeclaredDirectoryMetadata",
              "TestPublishedArtifactIdentityGolden",
              "TestPublishedArtifactInventoryModesRemainExact",
          }
          if platform.system() == "Windows":
              required.update({
                  "TestWindowsDirectorySecurityProtectedOwnerRoot",
                  "TestWindowsDirectorySecurityRefusals",
                  "TestWindowsDirectorySecurityInheritance",
                  "TestWindowsDirectorySecurityInvalidHandle",
                  "TestWindowsDirectorySecurityJunction",
              })
          else:
              required.update({
                  "TestLooseDirectoryUnixSecurityRefusals",
                  "TestLooseDirectoryUnixSafeDirectoryModes",
              })
          events = [json.loads(line) for line in Path(os.environ["TEST_RESULTS"]).read_text().splitlines()]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          skipped = [event.get("Test", event.get("Package")) for event in events if event.get("Action") == "skip"]
          missing = sorted(required - passed)
          if skipped or missing:
              raise SystemExit(f"Portable identity gate failed: skipped={skipped}; missing passes={missing}")
          print(f"Portable identity gate: {len(required)} required tests passed; no skips")
          PY
      - name: Platform-independent package tests
        run: go test -count=1 . ./oci ./evidence ./experimental/flow ./core ./internal/contract ./internal/jsoncodec ./policy

  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies and the distribution
        run: python -m pip install -r python/requirements-dev.txt ./python
      - name: Shared vectors, Go differential checks and isolated wheel/sdist install
        run: python -m pytest python/tests -q
      - name: Typecheck private implementation
        run: python -m mypy --config-file python/pyproject.toml python/src/agent_suite

  typescript:
    name: TypeScript policy parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: policy/typescript/package-lock.json
      - name: Build, typecheck and compare with Go
        run: |
          npm --prefix policy/typescript ci --ignore-scripts
          npm --prefix policy/typescript test
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Guard catalog history and schema immutability
        env:
          SCHEMA_EVENT: ${{ github.event_name }}
          SCHEMA_BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/schema-release.mjs check --catalog-ref refs/remotes/origin/main
      - name: Build and test documentation site
        run: |
          npm --prefix docs ci --ignore-scripts
          npm --prefix docs run docs:check
      - name: Browser accessibility regressions
        run: |
          npm --prefix docs exec playwright install --with-deps chromium
          npm --prefix docs run docs:test-browser
      - name: Link checker selftests
        run: python3 scripts/check-doc-links.py --selftest
      - name: Documentation links and anchors
        run: python3 scripts/check-doc-links.py
