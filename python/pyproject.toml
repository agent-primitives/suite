[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-suite"
version = "0.1.0.dev0"
description = "AgentSuite package reader and format models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["rfc8785==0.1.4", "jsonschema==4.26.0", "referencing==0.37.0", "google-re2==1.1.20251105", "requests==2.34.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agent_suite"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "re2", "re2.*"]
ignore_missing_imports = true
